name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch live data (never fails the build)
        run: python fetch.py
      - name: Build site
        run: python build.py
      - name: Save data history (never conflicts, never fails the deploy)
        run: |
          set +e
          git config user.name "surinamebusiness-bot"
          git config user.email "actions@users.noreply.github.com"
          cp -r data/live /tmp/live_new
          git fetch -q origin main && git reset -q --hard origin/main
          python - <<'PY'
          import json, os, shutil
          src, dst = "/tmp/live_new", "data/live"
          os.makedirs(dst, exist_ok=True)
          for f in os.listdir(src):
              if f == "rate_history.json" and os.path.exists(os.path.join(dst, f)):
                  try:
                      old = json.load(open(os.path.join(dst, f)))
                      new = json.load(open(os.path.join(src, f)))
                      old.setdefault("days", {}).update(new.get("days", {}))
                      json.dump(old, open(os.path.join(dst, f), "w"), ensure_ascii=False, indent=1, sort_keys=True)
                      continue
                  except Exception:
                      pass
              shutil.copy(os.path.join(src, f), os.path.join(dst, f))
          PY
          git add data/live
          git diff --cached --quiet || { git commit -qm "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"; git push -q origin HEAD:main || echo "push skipped"; }
          exit 0
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tell Bing and other IndexNow engines which pages changed (never fails)
        run: python indexnow.py || true
