name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch live data (never fails the build)
        run: python fetch.py
      - name: Save data history
        run: |
          git config user.name "surinamebusiness-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)" -q
            git pull --rebase -q || true
            git push -q || echo "push skipped"
          fi
      - name: Build site
        run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
